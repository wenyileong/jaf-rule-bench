<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAF Rule Bench</title>
<style>
/* Layout: an instrument bench. Fixed control rail on the left (the model's inputs), figures on the right in tabs (its outputs). */
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #141821; --ink-2: #4a5160; --muted: #727a89;
  --rule: #dde1e8; --rule-soft: #eceef2; --accent: #3a2fd6; --accent-soft: #ebe9fd; --rail: #f1f0fa;
  --s1: #1f6bff; --s2: #ff5a1f; --s3: #00b386; --s4: #ffb000; --s5: #e6007e; --s6: #7a3cff;
  --on-s1: #ffffff; --on-s2: #ffffff; --on-s3: #062b20; --on-s4: #3a2600; --on-s5: #ffffff; --on-s6: #ffffff;
  --seq-1: #d4f1ff; --seq-2: #8fd8ff; --seq-3: #3fb0ff; --seq-4: #1f6bff; --seq-5: #3a2fd6; --seq-6: #2a0d8f;
  --div-neg: #1f6bff; --div-mid: #f2f1ee; --div-pos: #ff2d55;
  --explain-bg: #fff8e1; --explain-rule: #ffb000;
  --on-strong: #ffffff; --warn-bg: #fdf3dc; --warn-ink: #7a5300; --bad-bg: #fde6e6; --bad-ink: #8a1f1f; --ok-ink: #1d6b3a;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-data: "Cascadia Mono", "Consolas", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --ink: #eef0f4; --ink-2: #b9bfcb; --muted: #8a92a2;
    --rule: #2d333f; --rule-soft: #242934; --accent: #a99bff; --accent-soft: #2a2550; --rail: #16151f;
    --s1: #4d8dff; --s2: #ff7a45; --s3: #19d3a2; --s4: #ffc233; --s5: #ff3fa4; --s6: #a07bff;
    --on-s1: #ffffff; --on-s2: #1c0a00; --on-s3: #062b20; --on-s4: #3a2600; --on-s5: #1c0010; --on-s6: #ffffff;
    --seq-1: #1d1a5c; --seq-2: #2f2aa8; --seq-3: #2f6cff; --seq-4: #3fb0ff; --seq-5: #8fd8ff; --seq-6: #d4f1ff;
    --div-neg: #4d8dff; --div-mid: #383835; --div-pos: #ff4d6d;
    --explain-bg: #2b2412; --explain-rule: #ffc233;
    --warn-bg: #3a2f14; --warn-ink: #f2cf7a; --bad-bg: #3f1d1d; --bad-ink: #f3b0b0; --ok-ink: #8fd6a8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100%; }
header.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--rule); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-size: 1.45rem; margin: 0; font-weight: 600; }
.brand .ver { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); }
.bar .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { font-size: 0.82rem; color: var(--ink-2); }
aside.rail { background: var(--rail); border-right: 1px solid var(--rule); overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
main { overflow-y: auto; padding: 18px 22px 40px; min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0; }
p { margin: 0; max-width: 74ch; }
.note { font-size: 0.84rem; color: var(--muted); }
.eyebrow { font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
#form { display: grid; gap: 18px; }
legend { font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.prm { display: grid; grid-template-columns: 1fr 74px; gap: 2px 8px; align-items: center; }
.prm label { font-size: 0.82rem; color: var(--ink-2); grid-column: 1 / -1; }
.prm input[type=range] { width: 100%; accent-color: var(--accent); }
.prm input[type=number] { width: 74px; font-family: var(--font-data); font-size: 0.82rem; padding: 3px 5px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--ink); }
.prm.changed label::after { content: " · changed"; color: var(--accent); }
button, select { font: inherit; font-size: 0.85rem; }
button { border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; background: var(--panel); color: var(--ink); }
.runbox { display: grid; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.runrow { display: flex; gap: 8px; flex-wrap: wrap; }
.prog { height: 6px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 300ms; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--ink-2); padding: 8px 12px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab { display: grid; gap: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.card-head .t { display: grid; gap: 3px; }
.tools { display: flex; gap: 4px; }
.tools button { padding: 3px 8px; font-size: 0.74rem; font-family: var(--font-data); color: var(--ink-2); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 0.84rem; color: var(--ink-2); }
.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.finding { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.finding .k { font-family: var(--font-data); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
th { font-size: 0.74rem; color: var(--ink-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; font-family: var(--font-data); font-size: 0.7rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font-body); font-size: 12px; fill: var(--ink-2); }
svg .grid { stroke: var(--rule-soft); stroke-width: 1; }
svg .ax { stroke: var(--rule); stroke-width: 1; }
svg .tick { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
svg .lab { fill: var(--ink); }
svg .hit { fill: transparent; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; font-size: 0.8rem; box-shadow: 0 6px 18px rgba(0,0,0,0.14); max-width: 300px; }
.banner { padding: 10px 14px; border-radius: 8px; font-size: 0.86rem; }
.banner.bad { background: var(--bad-bg); color: var(--bad-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.reg article { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; display: grid; gap: 3px; }
.mono { font-family: var(--font-data); font-size: 0.78rem; overflow-wrap: anywhere; }
.mode { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--rail); }
.mode button { border: 0; border-radius: 999px; padding: 4px 12px; background: transparent; color: var(--ink-2); font-size: 0.82rem; }
.mode button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
details.explain { background: var(--explain-bg); border-left: 4px solid var(--explain-rule); border-radius: 6px; padding: 8px 12px; font-size: 0.88rem; }
details.explain summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.explain dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0 2px; }
details.explain dt { font-weight: 600; color: var(--ink-2); }
details.explain dd { margin: 0; max-width: 78ch; }
details.tech { font-size: 0.82rem; color: var(--muted); }
details.tech summary { cursor: pointer; }
.help { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; cursor: help; margin-left: 4px; vertical-align: 1px; }
.sym { font-family: var(--font-data); font-size: 0.72rem; color: var(--muted); margin-left: 4px; }
.start { background: linear-gradient(135deg, var(--accent-soft), var(--panel)); border: 1px solid var(--rule); border-left: 5px solid var(--accent); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; }
.start ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 90ch; }
.gloss { display: grid; gap: 12px; }
.gloss article { display: grid; gap: 3px; border-left: 4px solid var(--c, var(--accent)); padding: 2px 0 2px 12px; }
.gloss .term { font-weight: 700; }
.gloss .tdef { font-size: 0.82rem; color: var(--muted); }
.gloss .tdef b { font-family: var(--font-data); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
.finding { border-top: 4px solid var(--c, var(--accent)); }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); height: auto; } aside.rail { border-right: 0; border-bottom: 1px solid var(--rule); } main { overflow: visible; } .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><h1>JAF Rule Bench</h1><span class="ver" id="ver"></span></div>
    <div class="actions">
      <div class="mode" role="group" aria-label="Reading mode"><button id="m-plain" title="Plain-English labels and explanations for readers without quantitative training">Plain English</button><button id="m-tech" title="Technical labels and notation for economists">Technical</button></div>
      <span class="status" id="status">Loading…</span>
      <button id="save">Save results to Documents</button>
      <button id="quit" title="Stops the local engine">Quit</button>
    </div>
  </header>

  <aside class="rail" aria-label="Model inputs">
    <div class="runbox">
      <div class="eyebrow">Run</div>
      <div class="prm"><label for="sweep" id="sweep-label">Sensitivity draws (0 to skip; about 30 seconds each)</label><input id="sweep" type="range" min="0" max="60" step="1" value="12"><input id="sweep-n" type="number" min="0" max="200" step="1" value="12"></div>
      <div class="runrow"><button class="primary" id="run">Run model</button><button id="cancel" disabled>Cancel</button><button id="reset">Defaults</button></div>
      <div class="prog" aria-hidden="true"><i id="bar"></i></div>
      <div class="note" id="prog-label">Ready.</div>
    </div>
    <form id="form" onsubmit="return false"></form>
    <p class="note" id="rail-note">Every output is model-implied on a synthetic world. Read rankings and directions rather than levels.</p>
  </aside>

  <main>
    <div id="banner"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="views"></div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
/* ================= state ================= */
let DATA = null, SPEC = null, DEFAULTS = null;
const S = { tab: "overview", netRule: "control", netConcept: "a", netThreshold: 0.08, rateMetric: "effective", rankMetric: "effective", obsMetric: "effective",
            mode: "plain", exMetric: "effective", exConcept: "a", exType: "bar", swX: "beta", swY: "eff_a", swRules: ["intermediary", "control", "owner_residence"] };
const RULE_ORDER = ["owner_residence", "intermediary", "control", "enclosure", "registration", "validation", "non_assignment"];
const LEAK = [["migration", "Migration", "--s1"], ["round_trip", "Round-tripping", "--s2"], ["conduit_switching", "Conduit switching", "--s3"],
              ["foreign_relocation", "Foreign relocation", "--s4"], ["to_gap", "Into the gap", "--s5"], ["exit", "Exit from the asset class", "--s6"]];
const pct = x => (x * 100).toFixed(1) + "%";
const f2 = x => Number(x).toFixed(2), f3 = x => Number(x).toFixed(3);
const $ = id => document.getElementById(id);
const short = r => DATA.rules[r]?.short || r;
const R = r => DATA.rules[r];
const usable = x => x.converged && !x.corner;

/* ================= reading mode and plain-English content ================= */
function loadMode() { try { const m = localStorage.getItem("jaf-mode"); if (m === "plain" || m === "tech") return m; } catch (e) {} return "plain"; }
function saveMode(m) { try { localStorage.setItem("jaf-mode", m); } catch (e) {} }
const PL = () => S.mode === "plain";
const P = (plain, tech) => (PL() ? plain : tech);
const CA = () => P("View A", "Concept (a)"), CB = () => P("View B", "Concept (b)");
const CA_LONG = () => P("View A (states treat holders' reactions as given)", "(a) elasticity-consistent");
const CB_LONG = () => P("View B (states also foresee how escape routes respond)", "(b) partial anticipation");

const TAB_NAMES = {
  overview: ["Overview", "Overview"], guide: ["Guide and glossary", "Glossary"], rates: ["Tax each rule sustains", "Rates"],
  networks: ["Cross-border picture", "Networks"], leakage: ["Where the base goes", "Leakage"], gap: ["Untaxed or double-taxed?", "Gap and overlap"],
  observation: ["What authorities can see", "Observation"], prop1: ["Why rules differ", "Proposition 1"], sensitivity: ["How robust?", "Sensitivity"],
  explorer: ["Chart builder", "Chart builder"], register: ["Findings register", "Register"],
};

const GROUP_NAMES = {
  "Competition": "How states compete", "Holders": "How holders behave", "Failure modes": "Gaps and double taxation",
  "Observation": "What tax authorities can see", "Configurations": "How holdings are held", "Numerics": "Technical settings",
};

/* plain label, plain help (shown on hover in both modes) */
const PARAM_PLAIN = {
  theta0: ["How strongly holders react to tax rates", "Higher values mean holdings move away more readily when a state raises its rate. Economists: the baseline semi-elasticity θ₀."],
  beta: ["How much escape routes add to that reaction", "Holders who can route through other states react more strongly. This sets how much those routes count. 0 switches the cross-border network off. Economists: β, the weight of escape capacity E in θ = θ₀ + βE."],
  alpha: ["How far indirect routes reach", "How much weight is given to routes that pass through third states (A to B to C). Higher counts longer chains. Economists: α, the per-step discount in the Katz resolvent."],
  sigma: ["How attached holders are to where they actually operate", "Higher values mean holders prefer to change the legal connecting factor (for example, switch exchange) rather than physically relocate. Economists: σ, the dispersion of location tastes in the mixed logit."],
  mobility_scale: ["How easily holders can switch the connecting factor", "Scales how easy it is to move a holding's legal hook (registration, infrastructure, chain) to another state. 1 is the default world."],
  exit_weight: ["Appeal of leaving digital assets altogether", "How attractive the outside option (holding no digital assets) is. Higher means more holders leave when taxes rise."],
  home_bias: ["Share of transactions that stay at home", "How much trading happens with counterparties in the same state. Affects how much cross-border traffic each rule creates."],
  rho: ["Treaty relief for double taxation", "When two states both claim the same holding, how much of the double tax is relieved. 0 means no relief; 1 means full relief, as with a full foreign tax credit under a tax treaty."],
  phi: ["Residence top-up on untaxed holdings", "When no rule gives any state the right to tax a holding, the holder's residence state may tax it at this fraction of its own rate (similar in spirit to a subject-to-tax or switch-over rule). 0 means the holding stays untaxed."],
  dual_residence: ["Share of holders resident in two states", "Holders with two residences can attract two residence claims."],
  obs_custodial: ["Visibility of exchange-held assets", "Share of holdings kept with exchanges or custodians that tax authorities can actually see (for example, through reporting rules such as CARF)."],
  obs_self: ["Visibility of self-held assets", "Share of holdings kept in the holder's own wallet that tax authorities can see."],
  enforcement_self: ["Visibility of self-held assets after stronger enforcement", "Used for the 'What authorities can see' comparison: the same world with this higher visibility."],
  w_custodial: ["Share held through exchanges or custodians", "Relative weight of holdings kept with an intermediary."],
  w_single: ["Share self-held with a single key", "Relative weight of holdings in the holder's own wallet, controlled by one key."],
  w_multisig: ["Share held in multi-signature wallets", "Relative weight of holdings that need several keys, possibly held in different states."],
  kappa_relief: ["Technical: smoothing of the relief calculation", "Leave at the default unless you are checking numerical robustness. Economists: κ for the softplus approximation to max(0, τₛ − τₚ)."],
  draws: ["Technical: number of simulated holder types", "More types give smoother results but slower runs."],
  seed: ["Which synthetic world", "Changes the randomly generated world (sizes of states, where holders sit). Use it to check that a result is not peculiar to one world."],
};

/* per-card explanations. what / read / means are plain English; title is the plain-mode title. */
const EX = {
  "c-table": { title: "The seven rules at a glance",
    what: "For each candidate rule for deciding which state may tax a digital-asset holding, the table shows the tax it sustains and how often it fails (leaves holdings untaxed, taxes them twice, or cannot see them).",
    read: "Effective rate: of every 100 units of holdings a rule lets a state tax, how many units of tax are collected. Yield: of every 100 units of holdings still in digital assets, how much tax anyone collects, counting holdings nobody may tax. Gap: holdings no state may tax. Overlap: holdings two states claim. Unobserved: holdings a state may tax but cannot see. Exit: holders who leave digital assets.",
    means: "This is the paper's comparison of assignment rules in numbers. A rule with a high effective rate but a low yield taxes well what it reaches but leaves much unreached." },
  "c-rates": { title: "How much tax each rule can sustain",
    what: "The tax rate that competing states settle on under each rule, once no state wants to change its rate.",
    read: "Longer bars mean more tax is sustained. Each rule has two bars, one for each view of how states behave (see the Guide). Use the menu to switch between the effective rate and the yield. Do not compare headline (nominal) rates across rules: a state that cannot see much of its base can announce a high rate that collects little.",
    means: "The paper argues that the choice of assignment rule shapes how far states can tax before holdings move. If the two views disagree about which rule is higher, the tool treats the two rules as tied." },
  "c-rank": { title: "Which rule beats which?",
    what: "Each cell compares the rule in the row with the rule in the column.",
    read: "▲ means the row rule sustains more tax, ▼ less, = the two views of state behaviour disagree (treat as a tie). Hover over a cell to see how often the verdict survived the robustness checks.",
    means: "Only verdicts that hold under both views are reported, so the comparison does not depend on a contested assumption about how far states look ahead." },
  "c-net-effect": { title: "Does the cross-border network matter?",
    what: "The tax each rule sustains with cross-border escape routes switched off, against the tax with them switched on.",
    read: "If the 'switched on' bar is much shorter, the ability to route holdings through other states is what holds rates down under that rule.",
    means: "Tests the paper's claim that the network of cross-border flows an assignment rule creates drives its consequences. In this model the network matters mostly when states look ahead (View B)." },
  "c-net": { title: "The cross-border picture each rule creates",
    what: "Six model states (J1 to J6). An arrow is drawn when a rule splits a transfer between two different states, so the transfer becomes cross-border for tax purposes.",
    read: "Each state has its own colour. Circle size: the share of holdings that state may tax. Circle fill: its tax rate (see the colour key beside the chart). Arrow thickness: how much flows between the two states. Use the slider to hide small flows.",
    means: "The same economic activity produces a different cross-border picture depending on which connecting factor the rule uses. That picture determines where holdings can escape to." },
  "c-leak": { title: "Where holdings go when a state raises its tax",
    what: "Each state in turn raises its rate a little. The bar shows where the holdings it loses end up.",
    read: "Migration: holders move to another state. Round-tripping: residents route their own holdings out through a foreign service and keep the benefit at home. Conduit switching: foreign holders who used this state as a channel pick another channel. Foreign relocation: foreign activity hosted here moves elsewhere. Into the gap: holdings move to a form no rule assigns. Exit: holders leave digital assets altogether.",
    means: "The paper predicts that rules based on easily moved connecting factors leak through restructuring rather than genuine relocation. The bars let you check that prediction rule by rule." },
  "c-gap": { title: "Is it worse to leave holdings untaxed or to tax them twice?",
    what: "Two rules that are identical except for one type of holding: a self-held key located abroad. Rule X leaves it untaxed (a gap); rule Y lets two states tax it (an overlap).",
    read: "Each square is one combination of treaty relief (left to right) and residence top-up (bottom to top). Red: the gap costs more than the double taxation. Blue: the double taxation costs more. Stronger colour means a bigger difference.",
    means: "This tests the paper's Proposition 3, that a gap is generally the costlier failure. In this model it is, except where the residence top-up is strong and treaty relief weak." },
  "c-obs": { title: "What happens if authorities can see more?",
    what: "Each rule with today's visibility of self-held assets, and with improved visibility.",
    read: "Compare the two bars for each rule. Hover to see how much of the base was invisible before and after.",

const GLOSS = [
  ["The seven candidate rules", [
    ["Owner-residence", "The state where the holder lives may tax the holding, wherever the asset or service sits. Comparable to residence-based taxation of individuals.", "Predicate: holder residence (personal). Dual residents attract a second claim (overlap).", "--s1"],
    ["Intermediary location", "The state where the exchange or custodian holding the asset is located may tax it. Assets the holder keeps in their own wallet are not reached.", "Predicate: intermediary seat (institutional). Self-hosted holdings fall into the gap unless a residence backstop applies.", "--s2"],
    ["Control", "The state where the person who controls the private key is located may tax. Where several people in different states must sign together, more than one state may claim.", "Predicate: key control (movable). Multi-signature with controllers in p ≠ j creates overlap.", "--s3"],
    ["Infrastructural enclosure", "The state where the technical infrastructure hosting the holding sits (for example, the wallet service or servers) may tax.", "Predicate: infrastructure location (movable), chosen by the holder.", "--s4"],
    ["Registration", "The state where the holding or its service provider is registered may tax.", "Predicate: registration (institutional), chosen by the holder.", "--s5"],
    ["Place of validation", "The state associated with the blockchain on which transactions are validated may tax. Holders choose which chain to use.", "Predicate: validation (elective, chain choice).", "--s6"],
    ["Universal non-assignment", "No rule gives any state the right to tax. Only a residence top-up, if any, applies. Included as a benchmark.", "Every option is in the gap. A corner case: there is no rate for the rule to sustain.", "--muted"],
  ]],
  ["Key measures", [
    ["Effective rate", "Of every 100 units of holdings a rule lets a state tax, how many units of tax are actually collected. The fairest way to compare what a rule can sustain.", "Rule revenue ÷ assigned base. Excludes the residence backstop collected on gap base.", "--accent"],
    ["Yield", "Of every 100 units of holdings still in digital assets, how much tax anyone collects. Unlike the effective rate, it counts holdings nobody may tax, so it penalises rules that leave holdings untaxed.", "Total revenue ÷ base remaining in the asset class (gap included).", "--accent"],
    ["Headline (nominal) rate", "The rate a state announces. Not comparable across rules, because a state that cannot see much of its base may announce a high rate that collects little.", "Equilibrium τ.", "--accent"],
    ["Gap", "Holdings no state has the right to tax under the rule (under-assignment).", "Share of base whose claim set is empty.", "--accent"],
    ["Overlap", "Holdings that two states claim, creating a risk of double taxation (over-assignment).", "Share of base with two claimants; relieved at rate ρ.", "--accent"],
    ["Unobserved", "Holdings a state has the right to tax but cannot see, so it collects nothing on them.", "Assigned base × (1 − observability).", "--accent"],

  ["How states are assumed to behave", [

    ["Conduit switching", "Foreign holders who used this state only as a channel switch to a channel in another state.", "Foreign activity hosted here moving its predicate to a third host.", "--s3"],
    ["Foreign relocation", "Foreign activity hosted here relocates to another state.", "Foreign activity relocating.", "--s4"],

function sensitivity(box) {
  const sw = DATA.sweep?.draws || [];
  if (!sw.length) { box.innerHTML = `<p class="note">This run had no sensitivity draws. Set the number of draws in the Run box and run again.</p>`; return; }
  const c = card(box, "c-sw", "How often each ranking holds across the sweep", `${sw.length} draws varying β, θ₀, ρ, φ, σ, relief smoothing, predicate mobility and the world seed.`);
  c.ctl.innerHTML = rankSwitch("rk2"); bindRankSwitch("rk2");
  const keys = Object.keys(RK()), rows = [["pair", "default", "same", "opposite", "tie", "unranked"]];
  const cats = [], same = [], opp = [], tie = [];
  for (const k of keys) {
    const v = RK()[k], hold = sw.map(d => RKd(d)[k]); const [a, b] = k.split("|");
    const n = hold.length; const sm = hold.filter(x => x === v && (v === ">" || v === "<")).length, op = hold.filter(x => (x === ">" || x === "<") && x !== v).length, ti = hold.filter(x => x === "tie").length, un = hold.filter(x => x === "unranked").length;
    if (v === "unranked") continue;
    cats.push({ label: `${short(a)} ${v === ">" ? ">" : v === "<" ? "<" : "≈"} ${short(b)}` }); same.push(sm / n); opp.push(op / n); tie.push(ti / n);
    rows.push([k, v, sm, op, ti, un]);
  }
  hBars(c.host, { cats, fmt: pct, xLabel: P("Share of robustness reruns", "Share of sweep draws"), max: 1, labelW: 230,
    series: [{ name: "Same verdict", color: "--s1", values: same }, { name: "Opposite verdict", color: "--s2", values: opp }, { name: "Concepts disagree", color: "--s4", values: tie }] });
  legend(c.host, [[P("Same result", "Same verdict"), "--s1"], [P("Reversed", "Opposite verdict"), "--s2"], [P("Views A and B disagree", "Concepts disagree"), "--s4"]]);
  setData("c-sw", rows);
}

    const st = await api("/api/state");
    $("bar").style.width = (st.progress * 100).toFixed(1) + "%";
    $("prog-label").textContent = st.running ? `${(st.progress * 100).toFixed(0)}% · ${st.label}${st.elapsed ? ` · ${Math.round(st.elapsed)} s` : ""}` : (st.error || "Ready.");
    $("run").disabled = st.running; $("cancel").disabled = !st.running;
    if (!st.running) { clearInterval(polling); polling = null; if (!st.error) { DATA = await api("/api/result"); statusLine(); render(); banner(""); } else banner(st.error, "warn"); }
  } catch (e) { clearInterval(polling); polling = null; banner("The engine is not responding. If you closed its window, start JAF Rule Bench again."); }
}
$("run").onclick = async () => { try { await api("/api/run", { params: readForm(), sweep: +$("sweep-n").value }); banner(""); if (!polling) polling = setInterval(poll, 700); poll(); } catch (e) { banner(e.message, "warn"); } };
$("cancel").onclick = () => api("/api/cancel", {}).catch(() => {});
$("save").onclick = async () => { try { const r = await api("/api/save", {}); banner(`Saved to <span class="mono">${r.folder}</span>`, "warn"); } catch (e) { banner(e.message, "warn"); } };
$("quit").onclick = async () => { try { await api("/api/quit", {}); } catch (e) {} banner("The engine has stopped. You can close this tab.", "warn"); $("run").disabled = true; };

(async function init() {
  try {
    const d = await api("/api/defaults"); SPEC = d.spec; DEFAULTS = d.params; $("ver").textContent = `version ${d.version}`;
    DATA = await api("/api/result"); if (!DATA.rules) DATA = null;
    buildForm(DATA ? { ...DEFAULTS, ...DATA.params } : DEFAULTS); statusLine(); applyMode();
    const st = await api("/api/state"); if (st.running) polling = setInterval(poll, 700);
  } catch (e) { banner("Could not reach the engine. Start JAF Rule Bench again."); buildTabs(); }
})();
</script>
</body>
