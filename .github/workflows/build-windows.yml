# Builds, tests and packages the Windows executable on GitHub's Windows runners.
# - On every push to a branch, every pull request, and on demand: test, build, smoke-test, and upload
#   the package as an artifact.
# - On a tag like v1.0.0: the same, then create a DRAFT release with the package attached.
#   Nothing is published until the author reviews the draft and presses "Publish release"
#   (which is also what triggers the Zenodo archive).
name: build-windows
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (versions pinned to match the third-party notices)
        run: python -m pip install numpy==2.1.3 openpyxl==3.1.5 pyinstaller==6.11.1
      - name: Acceptance tests on Windows
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_acceptance.py
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { (python -c "from jaf.params import VERSION; print(VERSION + '.0')").Trim() }
          "version=$v" >> $env:GITHUB_OUTPUT
          python packaging/version_info.py $v version_info.txt
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name JAF_Rule_Bench
          --icon packaging/jaf.ico --version-file version_info.txt
          --add-data "app/ui.html;app" --add-data "app/default_result.json;app" --add-data "app/default_world_result.json;app"
          --hidden-import jaf.report --hidden-import jaf.experiments --hidden-import jaf.world_report --hidden-import jaf.template
          --hidden-import jaf.design --hidden-import jaf.measure --hidden-import jaf.estimate --hidden-import jaf.recovery
          --hidden-import jaf.prereg --hidden-import jaf.examples --hidden-import openpyxl
          --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy main.py
      - name: Smoke test of the executable
        shell: pwsh
        run: |
          $env:JAF_NO_BROWSER = "1"
          $p = Start-Process -FilePath dist\JAF_Rule_Bench.exe -PassThru -RedirectStandardOutput exe.log -RedirectStandardError exe.err
          $u = "http://127.0.0.1:8765"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $d = Invoke-RestMethod "$u/api/defaults"; $ok = $true; break } catch { Start-Sleep 2 } }
          if (-not $ok) { Get-Content exe.log, exe.err; Write-Error "the interface did not start"; exit 1 }
          Invoke-RestMethod -Method Post "$u/api/world/illustrative" -Headers @{ "X-JAF" = "1" } -ContentType "application/json" -Body "{}" | Out-Null
          Invoke-RestMethod -Method Post "$u/api/est/run" -Headers @{ "X-JAF" = "1" } -ContentType "application/json" -Body '{"kind":"identify","params":{}}' | Out-Null
          for ($i = 0; $i -lt 120; $i++) { $s = Invoke-RestMethod "$u/api/est/state"; if (-not $s.running) { break }; Start-Sleep 2 }
          $e = Invoke-RestMethod "$u/api/est/data"
          if ($e.results.identify.status -ne "ok") { Write-Error "identification check failed: $($e.results.identify.status) $($s.error)"; exit 1 }
          Invoke-RestMethod -Method Post "$u/api/world/run" -Headers @{ "X-JAF" = "1" } -ContentType "application/json" -Body '{"params":{}}' | Out-Null
          for ($i = 0; $i -lt 120; $i++) { $s = Invoke-RestMethod "$u/api/world/state"; if (-not $s.running) { break }; Start-Sleep 2 }
          if ($s.error) { Write-Error "coded-world run failed: $($s.error)"; exit 1 }
          $h = @{ "X-JAF" = "1" }
          Invoke-RestMethod -Method Post "$u/api/world/save" -Headers $h -ContentType "application/json" -Body "{}" | Out-Null
          $ex = Invoke-RestMethod "$u/api/files/list?path=Exports"
          if ($ex.entries.Count -lt 1 -or $ex.entries[0].integrity -ne "ok") { Write-Error "saved bundle missing or not intact"; exit 1 }
          $pk = Invoke-RestMethod -Method Post "$u/api/files/op" -Headers $h -ContentType "application/json" -Body (@{ op = "package"; paths = @($ex.entries[0].rel); name = "ci" } | ConvertTo-Json)
          Invoke-WebRequest "$u/api/files/raw?path=$([uri]::EscapeDataString($pk.path))" -OutFile ci.jafpack
          $r = Invoke-WebRequest -Method Post "$u/api/world/illustrative" -ContentType "application/json" -Body "{}" -SkipHttpErrorCheck
          if ($r.StatusCode -ne 403) { Write-Error "a change without the interface header was accepted"; exit 1 }
          Invoke-WebRequest "$u/api/template/blank" -OutFile blank.xlsx
          if ((Get-Item blank.xlsx).Length -lt 10000) { Write-Error "template download failed"; exit 1 }
          Invoke-RestMethod -Method Post "$u/api/quit" -Headers @{ "X-JAF" = "1" } -ContentType "application/json" -Body "{}" | Out-Null
          Start-Sleep 3
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content exe.log
          "Smoke test passed: version $($d.version), identification $($e.results.identify.status), file library and request guard"
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "JAF_Rule_Bench_$v"
          New-Item -ItemType Directory -Force "$dir\templates", "$dir\docs" | Out-Null
          Copy-Item dist\JAF_Rule_Bench.exe, LICENSE.md, LICENSE-docs.txt $dir
          Copy-Item packaging\READ_ME_FIRST.txt "$dir\READ_ME_FIRST.txt"
          Copy-Item templates\*.xlsx "$dir\templates"
          Copy-Item docs\USER_GUIDE.md, docs\model_specification.md, docs\build_plan.md, docs\real_data_roadmap.md "$dir\docs"
          python tools/make_third_party_notices.py $env:pythonLocation "$dir\THIRD_PARTY_NOTICES.txt"
          Compress-Archive -Path $dir -DestinationPath "JAF_Rule_Bench_${v}_windows.zip"
          $h1 = (Get-FileHash dist\JAF_Rule_Bench.exe -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash "JAF_Rule_Bench_${v}_windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$h1  JAF_Rule_Bench.exe`n$h2  JAF_Rule_Bench_${v}_windows.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: JAF_Rule_Bench-windows
          path: |
            JAF_Rule_Bench_*_windows.zip
            SHA256SUMS.txt
  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: JAF_Rule_Bench-windows
      - name: Create a draft release (the author publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="packaging/release_notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          { cat "$notes"; echo; echo '**SHA-256**'; echo '```'; cat SHA256SUMS.txt; echo '```'; } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "JAF Rule Bench ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            JAF_Rule_Bench_*_windows.zip SHA256SUMS.txt
